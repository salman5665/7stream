<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="60%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#050811"/>
    </radialGradient>

    <!-- Brand Cyan-Emerald Gradient -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <!-- Accent Emerald Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Soft Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bgGrad)" stroke="#233554" stroke-width="4" filter="url(#shadow)"/>

  <!-- Inner Subtle Border -->
  <rect x="32" y="32" width="448" height="448" rx="96" fill="none" stroke="rgba(56, 189, 248, 0.18)" stroke-width="2"/>

  <!-- Broadcast Streaming Waves -->
  <g opacity="0.85" filter="url(#neonGlow)">
    <path d="M 330 140 A 55 55 0 0 1 385 195" fill="none" stroke="url(#primaryGrad)" stroke-width="10" stroke-linecap="round"/>
    <path d="M 355 115 A 90 90 0 0 1 425 185" fill="none" stroke="url(#primaryGrad)" stroke-width="10" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- Stylized Geometric "7" -->
  <g filter="url(#neonGlow)">
    <!-- Top Horizontal Bar of 7 -->
    <path d="M 120 140 L 330 140 C 342 140 348 148 344 158 L 226 380 C 220 392 208 396 198 388 L 180 374 C 172 368 174 356 182 342 L 274 186 L 120 186 C 108 186 100 178 100 166 L 100 160 C 100 148 108 140 120 140 Z" 
          fill="url(#primaryGrad)"/>
    
    <!-- Video Play Triangle Inside The Center -->
    <polygon points="186,225 186,305 250,265" fill="#ffffff" opacity="0.95" filter="url(#shadow)"/>
  </g>

  <!-- Brand Typography "7STREAM" -->
  <text x="256" y="445" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="34" 
        font-weight="900" 
        letter-spacing="9" 
        fill="#f1f5f9" 
        text-anchor="middle" 
        opacity="0.95">7STREAM</text>
  <text x="256" y="468" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="14" 
        font-weight="700" 
        letter-spacing="4" 
        fill="#38bdf8" 
        text-anchor="middle" 
        opacity="0.9">MEDIA SERVER</text>
</svg>
