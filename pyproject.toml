[project]
name = "sevenstream"
version = "1.0.0"
description = "7Stream - High Speed Local Video Streaming Server by Salman Sarod"
authors = [
    { name = "Salman Sarod" }
]

[tool.flet]
org = "com.salmansarod"
product = "7Stream"
company = "Salman Sarod"
copyright = "Copyright © 2026 Salman Sarod"

