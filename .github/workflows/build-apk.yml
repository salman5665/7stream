name: Build 7Stream Android APK & Play Store Bundle

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  FLET_PYTHON_BUILD_MANIFEST: ${{ github.workspace }}/manifest.json

jobs:
  build-apk:
    name: Build Android APK and AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Accept Android Licenses
        run: |
          yes | flutter doctor --android-licenses || true
          flutter doctor -v

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate Official Release Keystore
        run: |
          keytool -genkeypair -v \
            -keystore "${{ github.workspace }}/release.keystore" \
            -alias sevenstream \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "salmansarod7stream" \
            -keypass "salmansarod7stream" \
            -dname "CN=Salman Sarod, OU=Mobile Development, O=Salman Sarod, L=Mumbai, ST=Maharashtra, C=IN"

      - name: Configure Gradle Duplicates Strategy and Keystore
        run: |
          mkdir -p ~/.gradle/init.d
          cat << 'EOF' > ~/.gradle/init.d/duplicates-strategy.gradle
          allprojects {
              tasks.withType(Copy).configureEach {
                  duplicatesStrategy = DuplicatesStrategy.EXCLUDE
              }
              afterEvaluate { project ->
                  def ws = System.getenv('GITHUB_WORKSPACE') ?: '.'
                  def src = new File(ws, 'release.keystore')
                  if (src.exists()) {
                      def appDir = new File(project.projectDir, 'app')
                      if (appDir.exists()) {
                          new File(appDir, 'release.keystore').bytes = src.bytes
                      }
                      new File(project.projectDir, 'release.keystore').bytes = src.bytes
                  }
              }
          }
          EOF

      - name: Build Android Release APK with Flet
        run: |
          flet build apk \
            --project "sevenstream" \
            --org "com.salmansarod" \
            --product "7Stream" \
            --arch arm64-v8a \
            --build-number 1 \
            --build-version "1.0.0" \
            --company "Salman Sarod" \
            --copyright "Copyright (c) 2026 Salman Sarod" \
            --android-signing-key-store "${{ github.workspace }}/release.keystore" \
            --android-signing-key-store-password "salmansarod7stream" \
            --android-signing-key-password "salmansarod7stream" \
            --android-signing-key-alias "sevenstream" \
            --permissions photo_library \
            --android-permissions \
              android.permission.INTERNET=true \
              android.permission.ACCESS_NETWORK_STATE=true \
              android.permission.ACCESS_WIFI_STATE=true \
              android.permission.CHANGE_WIFI_STATE=true \
              android.permission.WAKE_LOCK=true \
              android.permission.FOREGROUND_SERVICE=true \
              android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK=true \
              android.permission.FOREGROUND_SERVICE_DATA_SYNC=true \
              android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS=true \
              android.permission.READ_EXTERNAL_STORAGE=true \
              android.permission.WRITE_EXTERNAL_STORAGE=true \
              android.permission.MANAGE_EXTERNAL_STORAGE=true \
              android.permission.READ_MEDIA_VIDEO=true \
              android.permission.READ_MEDIA_AUDIO=true \
              android.permission.READ_MEDIA_IMAGES=true \
              android.permission.ACCESS_MEDIA_LOCATION=true \
            --skip-flutter-doctor \
            --no-rich-output \
            --yes \
            .
          APK_PATH=$(find build -type f -name "*.apk" | head -n 1)
          if [ -n "$APK_PATH" ]; then
            echo "Found APK at: $APK_PATH"
            cp "$APK_PATH" 7Stream.apk
          fi

      - name: Build Google Play Store App Bundle (AAB) with Flet
        run: |
          flet build aab \
            --project "sevenstream" \
            --org "com.salmansarod" \
            --product "7Stream" \
            --arch arm64-v8a \
            --build-number 1 \
            --build-version "1.0.0" \
            --company "Salman Sarod" \
            --copyright "Copyright (c) 2026 Salman Sarod" \
            --android-signing-key-store "${{ github.workspace }}/release.keystore" \
            --android-signing-key-store-password "salmansarod7stream" \
            --android-signing-key-password "salmansarod7stream" \
            --android-signing-key-alias "sevenstream" \
            --permissions photo_library \
            --android-permissions \
              android.permission.INTERNET=true \
              android.permission.ACCESS_NETWORK_STATE=true \
              android.permission.ACCESS_WIFI_STATE=true \
              android.permission.CHANGE_WIFI_STATE=true \
              android.permission.WAKE_LOCK=true \
              android.permission.FOREGROUND_SERVICE=true \
              android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK=true \
              android.permission.FOREGROUND_SERVICE_DATA_SYNC=true \
              android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS=true \
              android.permission.READ_EXTERNAL_STORAGE=true \
              android.permission.WRITE_EXTERNAL_STORAGE=true \
              android.permission.MANAGE_EXTERNAL_STORAGE=true \
              android.permission.READ_MEDIA_VIDEO=true \
              android.permission.READ_MEDIA_AUDIO=true \
              android.permission.READ_MEDIA_IMAGES=true \
              android.permission.ACCESS_MEDIA_LOCATION=true \
            --skip-flutter-doctor \
            --no-rich-output \
            --yes \
            .
          AAB_PATH=$(find build -type f -name "*.aab" | head -n 1)
          if [ -n "$AAB_PATH" ]; then
            echo "Found AAB at: $AAB_PATH"
            cp "$AAB_PATH" 7Stream.aab
          fi

      - name: Verify Generated Artifacts
        run: |
          ls -lh 7Stream.* || true

      - name: Upload APK as Workflow Artifact
        if: hashFiles('7Stream.apk') != ''
        uses: actions/upload-artifact@v4
        with:
          name: 7Stream-Android-APK
          path: 7Stream.apk
          retention-days: 30

      - name: Upload Play Store AAB as Workflow Artifact
        if: hashFiles('7Stream.aab') != ''
        uses: actions/upload-artifact@v4
        with:
          name: 7Stream-PlayStore-AAB
          path: 7Stream.aab
          retention-days: 30

      - name: Create or Update GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "7Stream Release v1.0.0 by Salman Sarod"
          body: |
            ### 7Stream Android Video Streaming Server v1.0.0
            **Developed by Salman Sarod**
            
            - **`7Stream.apk`**: Official Release Signed APK for direct phone installation (Play Protect verified release key).
            - **`7Stream.aab`**: Official Release Signed Android App Bundle for Google Play Store upload.
            - **Offline Mobile Hotspot & Wi-Fi Streaming**
            - **Native HTTP 206 Byte-Range Video Seeking**
            - **One-Tap Permission Flow on First Launch**
            - **Language (Audio Track) & Subtitle Selectors**
            - **Direct VLC Launching and .m3u Playlist**
            - **Background Streaming Persistence with WakeLock**
          files: |
            7Stream.apk
            7Stream.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
